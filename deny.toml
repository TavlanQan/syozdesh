# SPDX-License-Identifier: AGPL-3.0-only

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    {
        id = "RUSTSEC-2024-0370",
        reason = "No safe upgrade is available; transitive dependency of the frozen Tauri/GTK bootstrap graph.",
    },
    {
        id = "RUSTSEC-2026-0173",
        reason = "No safe upgrade is available; transitive dependency required by the frozen libsignal/SPQR cryptographic dependency graph.",
    },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "AGPL-3.0-only",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "warn"
highlight = "all"

deny = [
    { name = "openssl"          },
    { name = "openssl-sys"      },
    { name = "native-tls"       },
    { name = "tokio-native-tls" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
required-git-spec = "tag"

allow-git = [
    "https://github.com/signalapp/libsignal",
    "https://github.com/signalapp/SparsePostQuantumRatchet",
]
