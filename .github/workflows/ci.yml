# SPDX-License-Identifier: AGPL-3.0-only

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  phase5_5_b:
    name: "Phase 5.5-B: bootstrap validation on CI"
    runs-on: ubuntu-24.04

    steps:
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            pkg-config \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            protobuf-compiler

      - name: Checkout pinned commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          source scripts/tool-versions.sh
          rustup toolchain install "${RUST_TOOLCHAIN}" \
              --profile minimal \
              --component rustfmt \
              --component clippy
          rustup default "${RUST_TOOLCHAIN}"
          rustc --version
          cargo --version

      - name: Install cargo-deny (pinned)
        run: |
          source scripts/tool-versions.sh
          cargo install --locked "cargo-deny@${CARGO_DENY_VERSION}"
          cargo-deny --version

      - name: Run Phase 5.5 gate
        run: ./scripts/phase5_5.sh
